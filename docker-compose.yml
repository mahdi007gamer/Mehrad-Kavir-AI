name: mehrad-kavir-ai
x-app: &app
  build: .
  env_file: .env
  volumes:
    - mkai-data:/srv/data
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 200
services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8787:8000"
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: ["python","-m","app.worker"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
volumes:
  mkai-data:
